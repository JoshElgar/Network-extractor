name: ISBN editions API test

on:
  push:
    branches:
      - isbn-enrichment-20260826
    paths:
      - .github/workflows/isbn-editions-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test edition-aware Open Library response
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          fields = "key,title,author_name,editions,editions.key,editions.title,editions.publisher,editions.publish_date,editions.isbn_10,editions.isbn_13,editions.language"
          params = {"title": "All Quiet on the Western Front", "author": "Erich Maria Remarque", "lang": "en", "limit": 3, "fields": fields}
          url = "https://openlibrary.org/search.json?" + urllib.parse.urlencode(params)
          request = urllib.request.Request(url, headers={"User-Agent": "ISBN-editions-test/1.0"})
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.load(response)
          print(json.dumps(payload.get("docs", [])[:2], indent=2)[:12000])
          PY
